<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="50%" stop-color="#0f1b33"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="fadeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#4FACFE" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>

  <!-- ambient glow -->
  <circle cx="120" cy="60" r="130" fill="#00F2FE" fill-opacity="0.06"/>
  <circle cx="1080" cy="240" r="150" fill="#4FACFE" fill-opacity="0.06"/>

  <!-- terminal chrome -->
  <circle cx="52" cy="42" r="6" fill="#FF5F56"/>
  <circle cx="76" cy="42" r="6" fill="#FFBD2E"/>
  <circle cx="100" cy="42" r="6" fill="#27C93F"/>
  <text x="128" y="48" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#5a7196">nano@dev: ~/profile</text>

  <!-- name -->
  <text x="600" y="148" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="56" font-weight="800" fill="url(#accentGrad)" letter-spacing="3">LƯU ĐỨC THÀNH CÔNG</text>

  <!-- divider -->
  <rect x="440" y="172" width="320" height="3" rx="1.5" fill="url(#accentGrad)" opacity="0.85"/>

  <!-- subtitle -->
  <text x="600" y="216" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#8aa3c7" letter-spacing="4">TECHNICAL LEAD · SOFTWARE ENGINEER</text>

  <!-- bottom wave -->
  <path d="M0 258 Q300 228 600 256 T1200 248 V300 H0 Z" fill="url(#fadeGrad)"/>
</svg>
