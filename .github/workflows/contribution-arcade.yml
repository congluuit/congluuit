name: Generate Arcade Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"   # chạy tự động mỗi ngày 00:00 UTC
  workflow_dispatch:       # cho phép chạy tay từ tab Actions
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate Breakout contribution graph SVG (light + dark)
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "breakout"
          hide_month_labels: "false"

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
